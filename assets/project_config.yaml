schema_version: 1
project_name: null
local_repo_path: null
skill_root: null
project_plan_path: null
# Ordered entries: {id: S1, path: relative/or/absolute/file.md, depends_on: []}
stage_files: []
# Only amendments actually approved by the user belong here.
approved_amendments: []
plan_version: null
agents_path: workflow/agents.yaml
state_path: workflow/state.json
review_records_dir: workflow/reviews

github:
  owner: null
  repo_name: null
  repo_url: null
  new_repo_visibility: private
  preserve_existing_visibility: true
  remote_name: origin
  branch: null
  new_project_branch: main
  existing_project_branch_prefix: codex/long-workflow-
  commit_and_push: true
  auto_merge_to_base: false

reviewer:
  browser: null
  chat_url: null
  normal_candidate_limit: 3
  escalated_candidate_limit: 3
  evidence_delivery: exact_commit_then_scoped_packet_if_inaccessible

heartbeat:
  required: true
  interval_minutes: null
  mode: same_router_conversation
  notify_on: [startup, stage_approved, needs_user, complete, meaningful_failure]
  quiet_when_unchanged: true

execution:
  worker_kind: independent_visible_task
  checkout: shared_project
  max_project_writers: 1
  max_known_operational_failures_per_problem: 3
  no_progress_checks_before_inspection: 2

authorization:
  # A real execution request is required; defaults do not grant permission.
  user_instruction_reference: null
  recorded_at: null
  resolved_settings_notified_at: null
  reviewer_delivery_scope: necessary_code_plans_tests_and_permitted_artifacts
  # Concrete additional user choices, if any; never store secrets here.
  overrides: []
